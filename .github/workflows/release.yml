name: Release WinMirror

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build winmirror.exe
        run: |
          cl.exe /O2 /std:c++17 /EHsc `
            src\main.cpp `
            src\ScreenCapture.cpp `
            src\Encoder.cpp `
            src\HttpServer.cpp `
            src\Beacon.cpp `
            src\Updater.cpp `
            /link `
            d3d11.lib dxgi.lib ole32.lib oleaut32.lib gdi32.lib windowscodecs.lib ws2_32.lib winhttp.lib iphlpapi.lib winmm.lib `
            /OUT:winmirror.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmirror-windows
          path: winmirror.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build winmirror_mac
        run: |
          clang++ -O3 -std=c++17 -framework Cocoa -framework QuartzCore mac/main.mm -o winmirror_mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmirror-macos
          path: winmirror_mac

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: winmirror-windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: winmirror-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: WinMirror ${{ github.ref_name }}
          files: |
            winmirror.exe
            winmirror_mac
          draft: false
          prerelease: false
          generate_release_notes: true
