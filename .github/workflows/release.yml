name: Release WinMirror

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build winmirror_rt.dll and winmirror.exe
        run: |
          rc.exe /nologo /fo src\winmirror.res src\winmirror.rc
          cl.exe /nologo /O2 /MT /LD /GL /GR- /GS /Gy /std:c++17 /EHsc /utf-8 `
            src\WinMirrorRuntime.cpp `
            /link /LTCG /OPT:REF /OPT:ICF /DEBUG:NONE /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA `
            user32.lib advapi32.lib winmm.lib ws2_32.lib `
            /OUT:winmirror_rt.dll
          cl.exe /nologo /O2 /MT /GL /GR- /GS /Gy /std:c++17 /EHsc /utf-8 `
            src\main.cpp `
            src\GuiWindow.cpp `
            src\ScreenCapture.cpp `
            src\Encoder.cpp `
            src\AudioCapture.cpp `
            src\AirPlayServer.cpp `
            src\BluetoothBridge.cpp `
            src\Beacon.cpp `
            src\Updater.cpp `
            src\winmirror.res `
            /link /SUBSYSTEM:WINDOWS /LTCG /OPT:REF /OPT:ICF /DEBUG:NONE /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA `
            d3d11.lib dxgi.lib dxguid.lib mfplat.lib mf.lib mfuuid.lib wmcodecdspuuid.lib `
            ole32.lib oleaut32.lib gdi32.lib user32.lib shell32.lib advapi32.lib ws2_32.lib bthprops.lib winhttp.lib iphlpapi.lib winmm.lib `
            /OUT:winmirror.exe
          Compress-Archive -Path winmirror.exe, winmirror_rt.dll -DestinationPath winmirror-windows.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmirror-windows
          path: |
            winmirror.exe
            winmirror_rt.dll
            winmirror-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build winmirror_mac and WinMirror.dmg
        run: ./build.sh mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmirror-macos
          path: |
            winmirror_mac
            WinMirror.dmg

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: winmirror-windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: winmirror-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: WinMirror ${{ github.ref_name }}
          files: |
            winmirror.exe
            winmirror_rt.dll
            winmirror-windows.zip
            winmirror_mac
            WinMirror.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
